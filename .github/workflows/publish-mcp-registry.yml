name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main, mcp-registry]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Show registry entry
        run: curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.yashgandhe666/pickedjobs"
